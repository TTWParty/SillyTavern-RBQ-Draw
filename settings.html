<div id="st-scene-trigger-settings" class="st-scene-trigger">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b id="st-scene-trigger-title">RBQ生图扩展</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down"></div>
    </div>
    <div class="inline-drawer-content">
      <div id="st-scene-trigger-update-bar" style="display:none;"></div>
      <div style="margin: 10px 0 8px;">
        <button id="st-scene-trigger-open-from-drawer" class="menu_button" type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; font-weight: 600; border-radius: 10px; background: linear-gradient(135deg, #5e6ad2, #828fff); color: #ffffff !important; border: none; cursor: pointer; box-shadow: 0 2px 8px rgba(94, 106, 210, 0.35);">
          <i class="fa-solid fa-palette"></i> 打开 RBQ 生图控制台
        </button>
      </div>
      <div class="st-scene-trigger-help" style="opacity: 0.85; font-size: 12px; margin-top: 6px;">
        快捷入口：<code>左侧悬浮球</code> 或 <code>左下角三横杠菜单</code>
      </div>
      <div class="st-scene-trigger-actions" style="display:flex; justify-content:space-between; align-items:center; margin-top: 10px;">
        <small style="opacity: 0.6;" id="st-scene-trigger-version-text"></small>
        <small id="st-scene-trigger-status-text">状态：未启动</small>
      </div>
    </div>
  </div>
</div>
